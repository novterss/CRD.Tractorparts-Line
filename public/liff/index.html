<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRD Tractor Parts - E-Commerce</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    
    :root {
      --primary: #FF5A5F;
      --bg: #121212;
      --surface: #1E1E1E;
      --text: #F3F3F3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 200px;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1590496793907-92058cb3714f?q=80&w=800') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 4px 15px rgba(255, 90, 95, 0.2);
    }

    .hero h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .hero p {
      font-size: 14px;
      color: #ddd;
      margin-top: 5px;
    }

    /* Product Grid */
    .container {
      padding: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .card {
      background: var(--surface);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .card:active {
      transform: scale(0.96);
    }

    .card-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .card-content {
      padding: 12px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price {
      font-size: 16px;
      color: var(--primary);
      font-weight: 600;
    }

    .btn-add {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Cart Floating Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cart-bar.active {
      transform: translateY(0);
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-total-label {
      font-size: 12px;
      color: #aaa;
    }

    .cart-total-price {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary);
    }

    .btn-checkout {
      background: linear-gradient(45deg, #FF5A5F, #FF3D43);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(255, 90, 95, 0.4);
      cursor: pointer;
    }

    /* Loading Overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <div class="hero">
    <h1>CRD Tractor Parts</h1>
    <p>Premium Quality Heavy Machinery Parts</p>
  </div>

  <div class="container">
    <div class="section-title">สินค้าขายดี (Best Sellers)</div>
    <div class="grid" id="productGrid">
      <!-- Products will be injected here via JS -->
    </div>
  </div>

  <div class="cart-bar" id="cartBar">
    <div class="cart-info">
      <span class="cart-total-label">รวมทั้งหมด (<span id="cartCount">0</span> ชิ้น)</span>
      <span class="cart-total-price">฿<span id="cartTotal">0</span></span>
    </div>
    <button class="btn-checkout" onclick="checkout()">ชำระเงิน</button>
  </div>

  <script>
    // Configuration - ใส่ LIFF ID ที่สร้างมาใหม่ตรงนี้
    const LIFF_ID = "YOUR_LIFF_ID_HERE"; 

    // Products Data
    const products = [
      { id: 'p1', name: 'น้ำมันเครื่องพรีเมียม 5L', price: 1200, img: 'https://images.unsplash.com/photo-1616238383804-0c58e733075d?w=400' },
      { id: 'p2', name: 'ชุดลูกกลิ้งและแทร็ก', price: 850, img: 'https://images.unsplash.com/photo-1587829462796-03714f3aebcb?w=400' },
      { id: 'p3', name: 'แก้มบุ้งกี๋รถขุดตีนตะขาบ', price: 3400, img: 'https://images.unsplash.com/photo-1517581177682-a085bc7fc952?w=400' },
      { id: 'p4', name: 'กรองอากาศแท้ศูนย์', price: 450, img: 'https://images.unsplash.com/photo-1621259182978-fbf93132e53d?w=400' }
    ];

    let cart = [];

    async function initializeLiff() {
      try {
        if (LIFF_ID === "YOUR_LIFF_ID_HERE") {
          console.warn("Please set your LIFF_ID");
          // ให้รันผ่าน Browser ปกติได้เพื่อการทดสอบ
          document.getElementById('loadingOverlay').style.opacity = '0';
          setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500);
          return;
        }

        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          document.getElementById('loadingOverlay').style.opacity = '0';
          setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500);
        }
      } catch (err) {
        console.error('LIFF Init Error:', err);
        alert('LIFF Init failed. Please check LIFF ID.');
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.img}" class="card-img" alt="${p.name}">
          <div class="card-content">
            <div class="card-title">${p.name}</div>
            <div class="card-price">฿${p.price.toLocaleString()}</div>
            <button class="btn-add" onclick="addToCart('${p.id}')">ใส่ตะกร้า</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCartUI();
    }

    function updateCartUI() {
      const cartBar = document.getElementById('cartBar');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');

      if (cart.length > 0) {
        cartBar.classList.add('active');
      } else {
        cartBar.classList.remove('active');
      }

      cartCount.innerText = cart.length;
      const total = cart.reduce((sum, p) => sum + p.price, 0);
      cartTotal.innerText = total.toLocaleString();
    }

    async function checkout() {
      if (cart.length === 0) return;

      const total = cart.reduce((sum, p) => sum + p.price, 0);
      const summary = cart.map((p, i) => `${i+1}. ${p.name}`).join('\\n');
      
      const message = `🛒 บันทึกคำสั่งซื้อจาก LIFF\\n\\n${summary}\\n\\n💰 ยอดรวม: ${total} บาท\\nกรุณาโอนเงินแล้วส่งสลิปในแชทนี้ได้เลยครับ`;

      try {
        if (liff.isInClient()) {
          await liff.sendMessages([
            {
              type: 'text',
              text: message
            }
          ]);
          liff.closeWindow();
        } else {
          alert("คำสั่งซื้อถูกบันทึกแล้ว! (เฉพาะในแอป LINE)");
        }
      } catch (error) {
        console.error('Send message failed', error);
        alert('เกิดข้อผิดพลาดในการส่งข้อความ');
      }
    }

    // On Load
    renderProducts();
    initializeLiff();
  </script>
</body>
</html>
